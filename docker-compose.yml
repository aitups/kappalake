
services:
  # ==========================================
  # 1. DATA STORAGE & METADATA
  # ==========================================
  
  # Metadata Database (Postgres)
  # Stores metadata for: Trino (Iceberg), Dagster, Keycloak
  postgres:
    image: postgres:15
    container_name: kappalake-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metastore
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
      - ./infra/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    networks:
      - kappalake-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object Storage (MinIO)
  # Stores the actual data (Bronze, Silver, Gold)
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: kappalake-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./infra/minio/data:/data
    networks:
      - kappalake-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Helper to create default bucket in MinIO
  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/warehouse;
      exit 0;
      "
    networks:
      - kappalake-net

  # ==========================================
  # 2. COMPUTE & QUERY ENGINE
  # ==========================================

  # Query Engine (Trino)
  # Federated SQL engine + Iceberg processing
  trino:
    image: trinodb/trino:460
    container_name: kappalake-trino
    ports:
      - "8080:8080"
    volumes:
      - ./infra/trino/etc:/etc/trino
    networks:
      - kappalake-net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Streaming Engine (Flink) - JobManager
  flink-jobmanager:
    image: flink:1.17-java11
    container_name: kappalake-flink-jm
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    networks:
      - kappalake-net

  # Streaming Engine (Flink) - TaskManager
  flink-taskmanager:
    image: flink:1.17-java11
    container_name: kappalake-flink-tm
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - kappalake-net

  # ==========================================
  # 3. INGESTION & STREAMING BUFFER
  # ==========================================

  # Streaming Buffer (Redpanda)
  # Kafka-compatible streaming platform
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.14
    container_name: kappalake-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8082:8082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - kappalake-net

  # Streaming: producer -> Redpanda -> consumer -> Iceberg (bronze.users_stream)
  stream-producer:
    build: ./infra/dagster
    container_name: kappalake-stream-producer
    entrypoint: ["python", "/opt/flink/stream_producer.py"]
    environment:
      REDPANDA_BOOTSTRAP: redpanda:29092
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./infra/flink/stream_producer.py:/opt/flink/stream_producer.py:ro
    depends_on:
      redpanda:
        condition: service_started
    networks:
      - kappalake-net

  stream-consumer:
    build: ./infra/dagster
    container_name: kappalake-stream-consumer
    entrypoint: ["python", "/opt/flink/stream_consumer.py"]
    environment:
      REDPANDA_BOOTSTRAP: redpanda:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TRINO_HOST: trino
      FLUSH_INTERVAL_SECONDS: "30"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./infra/flink/stream_consumer.py:/opt/flink/stream_consumer.py:ro
    depends_on:
      redpanda:
        condition: service_started
      trino:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - kappalake-net

  # ==========================================
  # 4. ORCHESTRATION (Dagster)
  # ==========================================

  # Dagster Webserver (UI)
  dagster-webserver:
    build: ./infra/dagster
    container_name: kappalake-dagster-web
    entrypoint: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    environment:
      DAGSTER_POSTGRES_USER: admin
      DAGSTER_POSTGRES_PASSWORD: password
      DAGSTER_POSTGRES_DB: dagster
    ports:
      - "3000:3000"
    volumes:
      - ./infra/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - ./infra/dagster/workspace.yaml:/opt/dagster/app/workspace.yaml
      - ./infra/dagster/repo.py:/opt/dagster/app/repo.py
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kappalake-net

  # Dagster Daemon (Scheduler/Sensors)
  dagster-daemon:
    build: ./infra/dagster
    container_name: kappalake-dagster-daemon
    entrypoint: ["dagster-daemon", "run"]
    environment:
      DAGSTER_POSTGRES_USER: admin
      DAGSTER_POSTGRES_PASSWORD: password
      DAGSTER_POSTGRES_DB: dagster
    volumes:
      - ./infra/dagster/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
      - ./infra/dagster/workspace.yaml:/opt/dagster/app/workspace.yaml
      - ./infra/dagster/repo.py:/opt/dagster/app/repo.py
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kappalake-net

  # ==========================================
  # 5. SECURITY & GOVERNANCE
  # ==========================================

  # Identity Provider (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: kappalake-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8180:8080" # Mapped to 8180 to avoid conflict with Trino (8080) or Flink (8081)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kappalake-net

  # ==========================================
  # 6. APPLICATION LAYER & AI
  # ==========================================

  # KappaLake API Gateway
  api:
    build: ./apps/api
    container_name: kappalake-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://admin:password@postgres:5432/metastore
      MINIO_URL: http://minio:9000
      TRINO_URL: http://trino:8080
      LLM_API_URL: http://llm:8080/v1
      LLM_MODEL: Qwen3.5-0.8B-Q4_K_M
      # Agentic layer: fastpath (private repo) mounted from ../fastpath
      PYTHONPATH: /opt/fastpath/src:/app
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: kappalake
      AUTH_ENABLED: "false"  # set "true" to require Keycloak JWTs
    volumes:
      - ../fastpath:/opt/fastpath:ro
    networks:
      - kappalake-net
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_started
      minio:
        condition: service_healthy
      llm:
        condition: service_healthy

  # KappaLake UI (Frontend)
  ui:
    build: ./apps/ui
    container_name: kappalake-ui
    ports:
      - "3001:3000"
    networks:
      - kappalake-net
    depends_on:
      - api

  # LLM Server (Hayai - OpenAI-compatible weight-streaming engine)
  llm:
    image: aitups/hayai:latest
    container_name: kappalake-llm
    environment:
      HAYAI_HOST: "0.0.0.0"
      HAYAI_PORT: "8080"
      HAYAI_MODELS_DIR: "/hayai/models"   # auto-scan registers every *.gguf
      HAYAI_DEVICE: "cpu"
      HAYAI_MEMORY_STRATEGY: "2048"  # cap 2GB: force full resident (hybrid/Qwen3.5 needs resident; streaming path WIP upstream)
      HAYAI_WINDOW: "2048"
      HAYAI_SINKS: "4"
      HAYAI_LOG: "info"
      # ChatML override: the stock Qwen3.5 template uses vision/tools/namespace constructs minijinja cannot render
      HAYAI_CHAT_TEMPLATE: "@/hayai/chat_template.jinja"
    ports:
      - "8085:8080" # Mapped to 8085 to avoid conflict
    volumes:
      - ./infra/llm/models:/hayai/models
      - ./infra/llm/chat_template.jinja:/hayai/chat_template.jinja:ro
    deploy:
      resources:
        limits:
          cpus: '8.0'
    networks:
      - kappalake-net

networks:
  kappalake-net:
    driver: bridge

volumes:
  redpanda-data:
